# Publish one SDK per tag: ruby-vX.Y.Z, browser-vX.Y.Z, go-vX.Y.Z or python-vX.Y.Z.
#
# The `check` job maps the tag to its SDK (.github/scripts/release-tag.sh)
# and each publish job runs only for its own SDK, so a tag never publishes
# another SDK. A bare vX.Y.Z (the old all-SDK form) fails in `check`.
#
# Runs in the `release` environment: a human approves every publish, and the
# environment only accepts the release tag patterns. RubyGems, npm and PyPI all
# use trusted publishing (OIDC): no publish token exists anywhere. Go needs no
# registry: proxy.golang.org serves a module once its path-prefixed tag
# exists, which is why Go is triggered by go-v* and its module tags
# (go/vX.Y.Z, go/gin/vX.Y.Z) are created only by the approved job.
name: release

on:
  push:
    tags: ['ruby-v*', 'browser-v*', 'go-v*', 'python-v*', 'v*']

permissions:
  contents: read

jobs:
  check:
    name: Tag names one SDK whose version matches
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.v.outputs.sdk }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: .github/scripts/release-tag.sh "$GITHUB_REF_NAME"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  ruby:
    needs: [check, test]
    if: needs.check.outputs.sdk == 'ruby'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - run: gem build devbench.gemspec
      # Idempotent, like npm: a re-run after a partial release skips what is
      # already out instead of failing on it.
      - run: |
          v="${{ needs.check.outputs.version }}"
          if gem list --remote --exact devbench --all | grep -qE "[( ]$v[,)]"; then
            echo "devbench $v is already on RubyGems; skipping"
          else
            gem push "devbench-$v.gem"
          fi

  npm:
    needs: [check, test]
    if: needs.check.outputs.sdk == 'browser'
    runs-on: ubuntu-latest
    environment: release
    env:
      # npm publish runs prepublishOnly (typecheck, tests, size); the vector
      # tests need the shared testdata. Missing it failed the v0.6.0 npm step.
      DEVBENCH_TESTDATA: ${{ github.workspace }}/testdata
      ADT_REQUIRE_VECTORS: '1'
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no token exists to leak
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1. The package's trusted
      # publisher (pasperry/devbench-sdk, release.yml, environment release)
      # is configured on npmjs.com after the one manual first publish.
      - run: npm install -g npm@latest
      # A version already on npm (e.g. the one manual first publish, needed
      # before trusted publishing can be configured) is skipped, not failed:
      # npm versions are immutable and republishing errors.
      - id: published
        run: |
          if npm view "devbench@${{ needs.check.outputs.version }}" version >/dev/null 2>&1; then
            echo "devbench@${{ needs.check.outputs.version }} is already on npm; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm ci
      - if: steps.published.outputs.skip != 'true'
        run: npm run build
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public

  go:
    needs: [check, test]
    if: needs.check.outputs.sdk == 'go'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the module tags
    steps:
      - uses: actions/checkout@v4
      # Modules in subdirectories are versioned by path-prefixed tags.
      - run: |
          v="v${{ needs.check.outputs.version }}"
          git fetch --tags -q origin
          tags=""
          for t in "go/$v" $( [ -f go/gin/go.mod ] && echo "go/gin/$v" ); do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
              echo "$t already exists; skipping"
            else
              git tag "$t" "$GITHUB_SHA"; tags="$tags $t"
            fi
          done
          [ -z "$tags" ] || git push origin $tags

  pypi:
    needs: [check, test]
    if: needs.check.outputs.sdk == 'python'
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for `devbench` names this repo, release.yml and
    # this environment: renaming any of them breaks the publish.
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade build
      - working-directory: python
        run: python -m build --outdir ../dist
      # Exactly the tagged version's sdist and wheel, nothing else: the
      # upload below takes every file in dist/.
      - run: |
          v="${{ needs.check.outputs.version }}"
          got="$(ls dist | sort | tr '\n' ' ')"
          want="devbench-$v-py3-none-any.whl devbench-$v.tar.gz "
          [ "$got" = "$want" ] || { echo "::error::dist/ holds '$got', want '$want'"; exit 1; }
      # skip-existing: a re-run after a partial release skips what is already
      # out instead of failing on it, like the RubyGems and npm jobs.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
