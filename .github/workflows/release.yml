# Publish all three SDKs for one version tag (vX.Y.Z).
#
# Runs in the `release` environment: a human approves every publish, and the
# environment only accepts v* tags. RubyGems and npm both use trusted
# publishing (OIDC): no publish token exists anywhere. Go needs no registry:
# proxy.golang.org serves a module once its path-prefixed tag exists.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Versions agree with the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          go_v=$(sed -n 's/^const Version = "\(.*\)"/\1/p' go/version.go go/*/version.go 2>/dev/null | head -1)
          rb_v=$(sed -n "s/.*VERSION = '\(.*\)'.*/\1/p" ruby/lib/devbench/version.rb 2>/dev/null | head -1)
          js_v=$(node -p "require('./browser/package.json').version")
          echo "tag=$tag go=$go_v ruby=$rb_v browser=$js_v"
          for v in "$go_v" "$rb_v" "$js_v"; do
            [ "$v" = "$tag" ] || { echo "::error::SDK versions must all equal the tag $tag"; exit 1; }
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  ruby:
    needs: [check, test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - run: gem build devbench.gemspec
      # Idempotent, like npm: a re-run after a partial release skips what is
      # already out instead of failing on it.
      - run: |
          v="${{ needs.check.outputs.version }}"
          if gem list --remote --exact devbench --all | grep -qE "[( ]$v[,)]"; then
            echo "devbench $v is already on RubyGems; skipping"
          else
            gem push "devbench-$v.gem"
          fi

  npm:
    needs: [check, test]
    runs-on: ubuntu-latest
    environment: release
    env:
      # npm publish runs prepublishOnly (typecheck, tests, size); the vector
      # tests need the shared testdata. Missing it failed the v0.6.0 npm step.
      DEVBENCH_TESTDATA: ${{ github.workspace }}/testdata
      ADT_REQUIRE_VECTORS: '1'
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC): no token exists to leak
    defaults:
      run:
        working-directory: browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1. The package's trusted
      # publisher (pasperry/devbench-sdk, release.yml, environment release)
      # is configured on npmjs.com after the one manual first publish.
      - run: npm install -g npm@latest
      # A version already on npm (e.g. the one manual first publish, needed
      # before trusted publishing can be configured) is skipped, not failed:
      # npm versions are immutable and republishing errors.
      - id: published
        run: |
          if npm view "devbench@${{ needs.check.outputs.version }}" version >/dev/null 2>&1; then
            echo "devbench@${{ needs.check.outputs.version }} is already on npm; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm ci
      - if: steps.published.outputs.skip != 'true'
        run: npm run build
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public

  go:
    needs: [check, test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the module tags
    steps:
      - uses: actions/checkout@v4
      # Modules in subdirectories are versioned by path-prefixed tags.
      - run: |
          v="v${{ needs.check.outputs.version }}"
          git fetch --tags -q origin
          tags=""
          for t in "go/$v" $( [ -f go/gin/go.mod ] && echo "go/gin/$v" ); do
            if git rev-parse -q --verify "refs/tags/$t" >/dev/null; then
              echo "$t already exists; skipping"
            else
              git tag "$t" "$GITHUB_SHA"; tags="$tags $t"
            fi
          done
          [ -z "$tags" ] || git push origin $tags
